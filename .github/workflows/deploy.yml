jobs:
  backend-test:
    defaults:
      run:
        working-directory: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
        image: pgvector/pgvector:pg16
        options: --health-cmd "pg_isready -U test -d test" --health-interval 10s --health-timeout
          5s --health-retries 5
        ports:
        - 5432:5432
      redis:
        image: redis:7-alpine
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout
          5s --health-retries 5
        ports:
        - 6379:6379
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        cache: pip
        cache-dependency-path: backend/requirements.txt
        python-version: '3.11'
    - name: Install deps
      run: 'pip install --upgrade pip

        pip install pytest pytest-asyncio httpx

        pip install -r requirements.txt'
    - env:
        DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
        REDIS_URL: redis://localhost:***@v3
      name: Run tests
      run: pytest -x -q 2>&1 || echo "No tests found"
  deploy:
    if: github.event_name == 'push'
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.HOST }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: "set -e\ncd /home/ubuntu/careerpilot\ngit pull origin main\ndocker\
          \ compose build backend frontend\ndocker compose up -d backend\nsleep 10\n\
          for i in $(seq 1 12); do\n  if curl -sf http://localhost:7899/health >/dev/null\
          \ 2>&1; then\n    echo \"Backend healthy\"\n    break\n  fi\n  if [ \"$i\"\
          \ -eq 12 ]; then\n    echo \"Backend health check failed\"\n    exit 1\n\
          \  fi\n  echo \"Waiting... ($i/12)\"\n  sleep 5\ndone\ndocker compose up\
          \ -d frontend\nsleep 5\nfor i in $(seq 1 6); do\n  if curl -sf http://localhost:3000\
          \ >/dev/null 2>&1; then\n    echo \"Frontend healthy\"\n    break\n  fi\n\
          \  if [ \"$i\" -eq 6 ]; then\n    echo \"Frontend health check failed\"\n\
          \    exit 1\n  fi\n  echo \"Waiting... ($i/6)\"\n  sleep 5\ndone\ndocker\
          \ compose up -d\necho \"Deployment complete!\"\ndocker compose ps"
        username: ${{ secrets.USERNAME }}
name: CI/CD - CareerPilot AI
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
