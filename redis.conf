# CareerPilot AI Redis Configuration
# Persistence: RDB snapshots every 5 min if at least 1 key changed
save 300 1
save 60 100
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Security
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Performance
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
